# Source registry.
#
# EVERY source must be registered here before any collection touches it.
# This is the provenance root: no metric in the report may trace to a source
# that is not listed below. Modeled on
# ~/Projects/investment-research/investment_research/sources/registry.py.
#
# Collection is BLOCKED for any source whose status != "verified".
#
# Field meanings:
#   id                stable slug used in code and provenance records
#   organization      publishing body
#   url               canonical landing page or API endpoint
#   access_method     one of: official_api | bulk_download | pdf_report |
#                     structured_html | permitted_scraping | manual_only
#   data_type         what the source provides (accident_stats, crash_test,
#                     recall, registration, research, news, ...)
#   jurisdiction      IN | GLOBAL | OTHER
#   coverage          geographic/temporal coverage (leave null until verified)
#   licence           licence / terms basis (null until verified)
#   permitted_use     plain-language statement of what use is allowed
#   terms_url         link to terms/robots/policy
#   attribution       required attribution text, if any
#   status            verified | pending_verification | blocked | rejected
#   verified_on       date the metadata was last checked (ISO), else null
#   notes             caveats, gaps, known biases
#
# IMPORTANT: entries below are CANDIDATES. They are deliberately marked
# "pending_verification" and carry no invented coverage, licence, or usage
# claims. Phase 3 verifies each before it is used.

version: 1

sources:
