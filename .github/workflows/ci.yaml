name: irsi
on:
  push:
    branches: [main]
    paths: [".github/workflows/**","src/**","tests/**","pyproject.toml","requirements.txt","config/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Lint (ruff if present)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff --version && ruff check src tests || true
          else
            echo "ruff not installed; skipping lint"
          fi

      - name: Type check (mypy if present)
        run: |
          if command -v mypy >/dev/null 2>&1; then
            mypy --version && mypy src || true
          else
            echo "mypy not installed; skipping typecheck"
          fi

      - name: Tests
        run: python -m pytest -q

      - name: Build report (smoke)
        run: |
          irsi report
          test -s reports/india-road-safety-report.html
